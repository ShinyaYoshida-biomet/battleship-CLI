name: Build and Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: x64
          - os: macos-14  # Apple Silicon
            platform: darwin
            arch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build binary
      run: python build_binary.py

    - name: Get binary name
      id: binary_name
      shell: bash
      run: |
        if [ "${{ matrix.platform }}" = "windows" ]; then
          echo "name=battleship-${{ matrix.platform }}-${{ matrix.arch }}.exe" >> $GITHUB_OUTPUT
        else
          echo "name=battleship-${{ matrix.platform }}-${{ matrix.arch }}" >> $GITHUB_OUTPUT
        fi

    - name: Upload binary to release
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./dist/${{ steps.binary_name.outputs.name }}
        asset_name: ${{ steps.binary_name.outputs.name }}
        asset_content_type: application/octet-stream

    - name: Upload binary as artifact
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v3
      with:
        name: ${{ steps.binary_name.outputs.name }}
        path: ./dist/${{ steps.binary_name.outputs.name }}